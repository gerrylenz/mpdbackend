<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MPD Player</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <img id="station-logo" class="station-logo hidden" alt="">
        <div>
          <p class="eyebrow">mpdbackend</p>
          <h1 id="channel-name">Radio</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="select-wrap">
          <span class="sr-only">Sender</span>
          <select id="channel-select" aria-label="Sender wählen"></select>
        </label>
        <span id="health-dot" class="health-dot" title="Verbindungsstatus"></span>
      </div>
    </header>

    <main class="player">
      <div class="artwork-wrap">
        <img id="cover" class="cover hidden" alt="Cover">
        <div id="cover-fallback" class="cover-fallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="artwork-glow" id="artwork-glow"></div>
      </div>

      <div class="meta">
        <p id="state-label" class="state-label">STOPPED</p>
        <h2 id="title" class="title">—</h2>
        <p id="artist" class="artist"></p>
        <p id="album" class="album"></p>
      </div>

      <div class="progress-block">
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="progress-times">
          <span id="elapsed">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div id="control-panel" class="control-panel">
        <div class="playlist-block">
          <div class="playlist-head">
            <span class="playlist-label">Playlist</span>
            <span id="playlist-pos" class="playlist-pos"></span>
          </div>
          <label class="select-wrap select-wrap-full">
            <span class="sr-only">Playlist wählen</span>
            <select id="playlist-select" aria-label="Playlist wählen">
              <option value="">Laden…</option>
            </select>
          </label>
        </div>

        <div class="controls">
          <button type="button" class="btn btn-ghost" id="btn-prev" aria-label="Vorheriger Titel">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6 8.5-6v12z"/></svg>
          </button>
          <button type="button" class="btn btn-primary" id="btn-play" aria-label="Wiedergabe">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
          </button>
          <button type="button" class="btn btn-ghost" id="btn-stop" aria-label="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6V6z"/></svg>
          </button>
          <button type="button" class="btn btn-ghost" id="btn-next" aria-label="Nächster Titel">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6v12l8.5-6L6 6zm9 0v12h2V6h-2z"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-mark-delete" id="btn-savefile" aria-label="Zum Löschen markieren" title="Zum Löschen markieren">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18"/>
            </svg>
          </button>
        </div>

        <div class="volume-block">
          <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/>
          </svg>
          <input type="range" id="volume" min="0" max="100" step="1" value="50" aria-label="Lautstärke">
          <span id="volume-label" class="volume-label">50</span>
        </div>
      </div>

      <div class="stream-block">
        <button type="button" class="btn btn-stream" id="btn-stream">
          <span id="stream-label">Stream starten</span>
        </button>
        <p class="hint">Audio über HTTP-Stream · Senderwahl oben</p>
      </div>
    </main>
  </div>

  <audio id="stream" preload="none" playsinline></audio>
  <script src="/app.js"></script>
</body>
</html>
