name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/install/requirements.txt pytest

      - name: Run server tests
        run: pytest server/tests/

  # Music Assistant provider tests require the full Music Assistant runtime
  # (see README: run inside the MA container). Server tests cover shared logic.
